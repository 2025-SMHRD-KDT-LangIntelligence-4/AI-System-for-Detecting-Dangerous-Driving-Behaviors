spring.application.name=ZeroAccident

# 우빈 : 스프링 구동시 처음으로 갈 페이지 주소 -> 현재 : '/'
server.servlet.context-path=

# 우빈 : 카멜케이스 ~ 스네이크케이스 자동변환
mybatis.configuration.map-underscore-to-camel-case=true

# 우빈 : 클라우드 DB 연결
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://project-db-campus.smhrd.com:3312/sc_25K_LI4_p3_3?useSSL=false&serverTimezone=Asia/Seoul
spring.datasource.username=sc_25K_LI4_p3_3
spring.datasource.password=smhrd3
# 우빈 : DB사용시 JPA에서 작동되는 쿼리문 확인 가능
spring.jpa.show-sql=true 

# 우빈 : 포트설정
server.port=3312

# 우빈 : 접두사, 접미사 설정
spring.mvc.view.prefix=/WEB-INF/
spring.mvc.view.suffix=.jsp

# 우빈 : src/main/resources/mapper/*.xml 읽기
mybatis.mapper-locations=classpath*:mapper/*.xml


